version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "monthly" }
    labels: ["type:chore"]

  # The only Node service in this repo is the Playwright scraper sidecar.
  - package-ecosystem: "npm"
    directory: "/services/playwright-service"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 5
    labels: ["type:chore", "area:scraping"]

  - package-ecosystem: "docker"
    directory: "/services/playwright-service"
    schedule: { interval: "monthly" }
    labels: ["type:chore"]
